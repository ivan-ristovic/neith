name: Run tests

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.gitea/actions/setup-rust

      - name: Build
        run: ./build

      - name: Release
        run: ./release

      - name: Run tests
        run: ./test

      - name: Check for failures
        if: ${{ failure() }}
        uses: https://github.com/ivan-ristovic/action-gitea-workflow-error-email@v1
        with:
          smtp-host: ${{ secrets.SMTP_HOST }}
          smtp-username: ${{ secrets.SMTP_USERNAME }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_FROM }}
          to: ${{ secrets.WORKFLOW_ERROR_EMAIL }}

